<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offerbiu 开发历程</title>
    <meta name="description" content="Offerbiu 开发历程：面向 2027 届校招的本地优先求职工作台，从 2026-09-05 到 2026-11-12。" />
    <meta name="theme-color" content="#0e0b26" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Offerbiu 开发历程" />
    <meta property="og:description" content="让每一次投递，都有下一步。一条像素回廊，走回 Offerbiu 的每个里程碑。" />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/fonts/fusion-pixel-12px-zh_hans.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      html,body{margin:0;background:#0e0b26}
      #loader{position:fixed;inset:0;z-index:100;background:#0e0b26;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#ffd23f;transition:opacity .45s steps(5)}
      #loader.hide{opacity:0;pointer-events:none}
      #loader .bar{width:192px;height:12px;border:4px solid #365cf5;padding:2px;box-sizing:content-box}
      #loader .bar i{display:block;height:100%;width:0;background:#ffd23f;animation:ld 1.2s steps(8) infinite}
      #loader span{font:24px/1 "FusionPixel",monospace;letter-spacing:2px}
      @keyframes ld{to{width:100%}}
    </style>
  </head>
  <body>
    <div id="loader" role="status"><span>OFFERBIU</span><div class="bar"><i></i></div><small style="color:#8e86c9;font:12px/1 FusionPixel,monospace">正在开门…</small></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
